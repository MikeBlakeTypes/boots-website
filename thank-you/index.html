<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Thank You for the Liquid Applause! — BOOTS</title>
  <meta name="description" content="A thank-you from BOOTS for supporting live music.">
  <meta name="robots" content="noindex,follow">

  <meta property="og:title" content="Thank You for the Liquid Applause! — BOOTS">
  <meta property="og:description" content="You’ve made Mike and Jason smile. Prost!">
  <meta property="og:type" content="website">

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <style>
    :root {
      --bg: #0A0A0A;
      --bg-soft: #0E0C08;
      --gold: #C3A25C;
      --gold-40: rgba(195, 162, 92, 0.4);
      --cream: #F2EEE4;
      --cream-dim: rgba(242, 238, 228, 0.88);
      --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --display: 'Oswald', 'Arial Narrow', sans-serif;
      --serif: 'EB Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      color-scheme: dark;
    }

    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(195,162,92,0.08), transparent 34rem),
        var(--bg);
      color: var(--cream);
      font-family: var(--serif);
      overflow-x: hidden;
    }

    ::selection { background: var(--gold); color: var(--bg); }

    a,
    button { -webkit-tap-highlight-color: transparent; }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 74px;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(195, 162, 92, 0.18);
      background: rgba(10, 10, 10, 0.92);
    }

    .logo {
      color: var(--gold);
      font-family: var(--display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.3em;
      line-height: 1;
      text-indent: 0.3em;
      text-decoration: none;
    }

    .logo:focus-visible,
    .back-button:focus-visible,
    .privacy-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 5px;
    }

    .main {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: clamp(46px, 8vh, 88px) 24px clamp(48px, 8vh, 82px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
      color: var(--gold);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-indent: 0.25em;
    }

    .kicker::before,
    .kicker::after {
      content: "";
      display: block;
      width: 42px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(38px, 6.4vw, 72px);
      font-weight: 400;
      line-height: 1.08;
      text-wrap: balance;
    }

    .supporting-message {
      margin: clamp(20px, 3vh, 30px) 0 0;
      color: var(--cream-dim);
      font-size: clamp(21px, 3.1vw, 30px);
      line-height: 1.45;
      text-wrap: balance;
    }

    .prost {
      margin: 18px 0 0;
      color: var(--gold);
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
    }

    .thank-you-yodel {
      margin-top: clamp(42px, 7vh, 70px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .yodel-control {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      font: inherit;
    }

    .yodel-control:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 12px;
      border-radius: 18px;
    }

    .yodel-visual {
      position: relative;
      display: block;
      width: clamp(92px, 13vw, 122px);
      aspect-ratio: 1140 / 2047;
      transform-origin: 50% 12%;
    }

    .yodel-trousers {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .yodel-vibration {
      position: absolute;
      top: 43%;
      width: clamp(20px, 3vw, 27px);
      height: auto;
      opacity: 0;
      pointer-events: none;
    }

    .yodel-vibration--left { right: calc(100% + 8px); }
    .yodel-vibration--right { left: calc(100% + 8px); }

    .yodel-prompt {
      color: var(--gold);
      font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(20px, 3vw, 27px);
      font-style: italic;
      line-height: 1.2;
      transform: rotate(-2deg);
    }

    .thank-you-yodel.is-yodelling .yodel-visual {
      animation: yodel-vibrate 0.68s ease-in-out;
    }

    .thank-you-yodel.is-yodelling .yodel-vibration {
      animation: yodel-marks 0.68s ease-in-out;
    }

    @keyframes yodel-vibrate {
      0%, 100% { transform: rotate(0deg) translateX(0); }
      15% { transform: rotate(-3deg) translateX(-3px); }
      30% { transform: rotate(3deg) translateX(3px); }
      45% { transform: rotate(-2.5deg) translateX(-2px); }
      60% { transform: rotate(2.5deg) translateX(2px); }
      75% { transform: rotate(-1.5deg); }
    }

    @keyframes yodel-marks {
      0%, 100% { opacity: 0; transform: scale(0.88); }
      25%, 75% { opacity: 1; transform: scale(1); }
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(100%, 250px);
      min-height: 52px;
      margin-top: clamp(38px, 6vh, 58px);
      padding: 14px 28px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: transparent;
      color: var(--cream);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.21em;
      text-indent: 0.21em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .back-button:hover {
      background: var(--gold);
      color: var(--bg);
    }

    .footer {
      padding: 22px 24px 26px;
      border-top: 1px solid var(--gold-40);
      text-align: center;
      background: rgba(10, 10, 10, 0.78);
    }

    .privacy-link {
      color: rgba(242, 238, 228, 0.62);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-decoration: none;
    }

    .privacy-link:hover { color: var(--gold); }

    @media (max-width: 520px) {
      .header { min-height: 66px; }

      .main {
        padding-top: 42px;
        padding-inline: 20px;
      }

      .kicker {
        gap: 11px;
        font-size: 10px;
      }

      .kicker::before,
      .kicker::after { width: 28px; }

      .thank-you-yodel { margin-top: 38px; }

      .yodel-control { gap: 15px; }

      .back-button { width: min(100%, 280px); }
    }

    @media (max-height: 720px) and (min-width: 700px) {
      .main { padding-block: 38px; }
      .thank-you-yodel { margin-top: 34px; }
      .back-button { margin-top: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .thank-you-yodel.is-yodelling .yodel-visual,
      .thank-you-yodel.is-yodelling .yodel-vibration {
        animation: none;
      }
      .thank-you-yodel.is-yodelling .yodel-vibration { opacity: 1; }
      .back-button { transition: none; }
    }
  </style>
</head>
<body>
  <!-- BOOTS Website v2.7.5.1 — Thank-You Wording Refinement -->
  <div class="page">
    <header class="header">
      <a class="logo" href="../" aria-label="Back to the BOOTS homepage">BOOTS</a>
    </header>

    <main class="main">
      <div class="kicker" aria-hidden="true">LIQUID APPLAUSE</div>

      <h1>Thanks for the Liquid Applause!</h1>
      <p class="supporting-message">You’ve made Mike and Jason smile.</p>
      <p class="prost">PROST!</p>

      <section class="thank-you-yodel" id="thankYouYodel" aria-label="BOOTS thank-you yodel">
        <button
          type="button"
          class="yodel-control"
          id="thankYouYodelButton"
          aria-label="Play your BOOTS thank-you yodel"
        >
          <span class="yodel-visual" aria-hidden="true">
            <img class="yodel-vibration yodel-vibration--left" src="../assets/yodelling-lederhosen/vibration-left.svg" alt="">
            <img class="yodel-trousers" src="../assets/yodelling-lederhosen/yodelling-lederhosen-cutout-web.png" alt="">
            <img class="yodel-vibration yodel-vibration--right" src="../assets/yodelling-lederhosen/vibration-right.svg" alt="">
          </span>
          <span class="yodel-prompt">Tap the Lederhosen for your thank-you yodel!</span>
        </button>

        <audio id="thankYouYodelAudio" preload="none">
          <source src="../assets/yodelling-lederhosen/yodelling-trousers.ogg" type="audio/ogg">
          <source src="../assets/yodelling-lederhosen/yodelling-trousers.mp3" type="audio/mpeg">
          <source src="../assets/yodelling-lederhosen/yodelling-trousers.wav" type="audio/wav">
        </audio>
      </section>

      <a class="back-button" href="../">BACK TO BOOTS</a>
    </main>

    <footer class="footer">
      <a class="privacy-link" href="../privacy.html">PRIVACY &amp; COOKIES / DATENSCHUTZ</a>
    </footer>
  </div>

  <script>
    (function () {
      var feature = document.getElementById('thankYouYodel');
      var button = document.getElementById('thankYouYodelButton');
      var audio = document.getElementById('thankYouYodelAudio');
      if (!feature || !button || !audio) return;

      function animateYodel() {
        feature.classList.remove('is-yodelling');
        void feature.offsetWidth;
        feature.classList.add('is-yodelling');
        window.setTimeout(function () {
          feature.classList.remove('is-yodelling');
        }, 700);
      }

      function playYodel() {
        animateYodel();
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        }
        audio.play().catch(function () {
          /* Browser retains control if playback is blocked. */
        });
      }

      button.addEventListener('click', playYodel);
    })();
  </script>
</body>
</html>
